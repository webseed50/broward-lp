name: Protocol probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: PB + Polk probe
        run: |
          mkdir -p data/logs
          python3 - > data/logs/pb_polk_probe.txt 2>&1 <<'PY'
          import re, urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent", "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Safari/604.1")]
          def get(url, t=25):
              return op.open(url, timeout=t).read().decode("utf-8", "replace")
          print("### PALM BEACH: landing page links/forms ###")
          try:
              page = get("https://erec.mypalmbeachclerk.com/")
              for m in re.findall(r'(?:href|action|src)="([^"]+)"', page):
                  if not m.startswith(("http://www.w3", "/Content", "/Scripts")):
                      print("  ", m[:120])
              # try to follow an accept/search link
              for cand in re.findall(r'href="([^"]*(?:accept|search|agree|or_web)[^"]*)"', page, re.I):
                  url = cand if cand.startswith("http") else "https://erec.mypalmbeachclerk.com" + cand
                  try:
                      nxt = get(url)
                      print(f"  FOLLOW {url} -> {len(nxt)}b :: {nxt[:200]!r}")
                  except Exception as e:
                      print(f"  FOLLOW {url} -> FAILED {e}")
          except Exception as e:
              print("  PB FAILED:", e)
          print()
          print("### POLK browserviewor ###")
          try:
              b = get("https://apps.polkcountyclerk.net/browserviewor/", t=20)
              print(f"  root -> {len(b)}b :: {b[:400]!r}")
          except Exception as e:
              print("  FAILED:", e)
          print()
          print("### LEE retry, browser headers, long timeout ###")
          try:
              b = get("https://or.leeclerk.org/LandMarkWeb", t=40)
              print(f"  -> {len(b)}b :: {b[:300]!r}")
          except Exception as e:
              print("  still blocked:", e)
          PY
          cat data/logs/pb_polk_probe.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "pb polk probe"
          git push || true
