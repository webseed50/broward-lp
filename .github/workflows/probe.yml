name: Protocol probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sample real index files
        run: |
          pip install -q paramiko
          mkdir -p data/samples
          python3 - <<'PY'
          import paramiko
          tr = paramiko.Transport(("BCFTP.Broward.org", 22))
          tr.connect(username="crpublic", password="crpublic")
          s = paramiko.SFTPClient.from_transport(tr)
          D = "Official_Records_Download"
          for f in ["07-31-2026doc-ver.txt", "07-31-2026nme-ver.txt",
                    "07-31-2026lgl-ver.txt", "07-31-2026lnk-ver.txt",
                    "07-31-2026doc-ver-rng.txt"]:
              s.get(f"{D}/{f}", f"data/samples/{f}")
              print("got", f)
          with s.open("OR_Yearly_Exports/CY2025doc-rec.txt", "r") as fh:
              head = fh.read(120_000)
          open("data/samples/CY2025doc-rec.head.txt", "wb").write(head)
          print("got yearly head")
          tr.close()
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "samples $(date -u +%FT%TZ)"
          git push || true
