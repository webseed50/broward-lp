name: Protocol probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Tri-county feasibility probe
        run: |
          mkdir -p data/logs
          python3 - > data/logs/county_probe.txt 2>&1 <<'PY'
          import re, urllib.request
          H = {"User-Agent": "Mozilla/5.0", "Accept": "*/*"}
          def get(url):
              r = urllib.request.Request(url, headers=H)
              return urllib.request.urlopen(r, timeout=25).read().decode("utf-8", "replace")
          def probe(label, base, paths):
              print(f"##### {label} #####")
              for p in paths:
                  try:
                      b = get(f"{base}/{p}")
                      print(f"  {p} -> {len(b)}b :: {b[:250]!r}")
                  except Exception as e:
                      print(f"  {p} -> FAILED {e}")
              print()
          lm_paths = ["api/searchCriterias/document", "api/documentTypes",
                      "api/search/searchCriteria", "Home/GetDocumentTypes",
                      "Document/GetSearchResults", ""]
          probe("LEE LandmarkWeb", "https://or.leeclerk.org/LandMarkWeb", lm_paths)
          probe("PALM BEACH erec", "https://erec.mypalmbeachclerk.com", lm_paths)
          probe("PALM BEACH /LandMarkWeb", "https://erec.mypalmbeachclerk.com/LandMarkWeb", lm_paths)
          # Polk: discover the official-records search app from the clerk page
          try:
              page = get("https://www.polkclerkfl.gov/184/Official-Records")
              links = sorted(set(re.findall(r'https?://[a-zA-Z0-9.\-/]*polk[a-zA-Z0-9.\-/]*', page)))
              print("##### POLK discovered links #####")
              for l in links[:30]: print("  ", l)
              for l in links:
                  if any(k in l.lower() for k in ("ori", "oncore", "records", "search", "pro")):
                      try:
                          b = get(l)
                          print(f"  FETCH {l} -> {len(b)}b :: {b[:200]!r}")
                      except Exception as e:
                          print(f"  FETCH {l} -> FAILED {e}")
          except Exception as e:
              print("POLK discovery failed:", e)
          PY
          cat data/logs/county_probe.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "county probe"
          git push || true
