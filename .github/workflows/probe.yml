name: Protocol probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          pip install -q paramiko
          mkdir -p data/logs
          python3 - > data/logs/probe.txt 2>&1 <<'PY'
          import socket, ssl, ftplib
          HOST="BCFTP.Broward.org"; U=P="crpublic"
          def t(label, fn):
              try: print(label, "->", fn())
              except Exception as e: print(label, "FAILED:", type(e).__name__, str(e)[:200])
          def banner21():
              s=socket.create_connection((HOST,21),timeout=20); s.settimeout(20)
              try: d=s.recv(200)
              except socket.timeout: return "TCP open, no banner in 20s"
              return repr(d)
          def ftps990():
              raw=socket.create_connection((HOST,990),timeout=25)
              ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
              s=ctx.wrap_socket(raw, server_hostname=HOST)
              f=ftplib.FTP_TLS(); f.context=ctx; f.sock=s; f.file=s.makefile("r"); f.welcome=f.getresp()
              f.login(U,P); f.prot_p(); n=f.nlst()
              return f"welcome={f.welcome!r} entries={len(n)} sample={n[:6]}"
          def sftp22():
              import paramiko
              tr=paramiko.Transport((HOST,22)); tr.banner_timeout=25
              tr.connect(username=U,password=P)
              s=paramiko.SFTPClient.from_transport(tr); n=s.listdir("."); tr.close()
              return f"entries={len(n)} sample={n[:6]}"
          t("banner on 21", banner21)
          t("implicit FTPS 990", ftps990)
          t("SFTP 22", sftp22)
          PY
          cat data/logs/probe.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "probe $(date -u +%FT%TZ)"
          git push || true
