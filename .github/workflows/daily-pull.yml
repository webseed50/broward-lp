name: Broward LP daily pull
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch index files
        run: python fetch_broward.py
      - name: Commit new data
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: pull $(date -u +%F)"
          git push || true

