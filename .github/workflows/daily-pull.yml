name: Broward LP daily pull
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      backfill_years:
        description: "Optional: e.g. CY2025"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull county records
        env:
          BACKFILL_YEARS: ${{ inputs.backfill_years }}
        run: |
          pip install -q paramiko
          mkdir -p data/logs
          python fetch_broward.py > data/logs/run.txt 2>&1 || echo "NONZERO EXIT" >> data/logs/run.txt
          tail -5 data/logs/run.txt
      - name: Enrich with BCPA
        run: |
          python enrich_bcpa.py > data/logs/enrich.txt 2>&1 || echo "NONZERO EXIT" >> data/logs/enrich.txt
          tail -5 data/logs/enrich.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "pull $(date -u +%F)"
          git push || true
