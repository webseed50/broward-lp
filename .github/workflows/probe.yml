name: Protocol probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Dump MDC shim + PB inline JS
        run: |
          mkdir -p data/logs
          python3 - > data/logs/dump_probe.txt 2>&1 <<'PY'
          import re, urllib.request, http.cookiejar
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          op.addheaders = [("User-Agent","Mozilla/5.0 (iPhone; CPU iPhone OS 17_0) Safari/604.1")]
          def get(u,t=25): return op.open(u,timeout=t).read().decode("utf-8","replace")
          print("##### MIAMI-DADE StandardSearch.aspx FULL BODY #####")
          try:
              print(get("https://onlineservices.miamidadeclerk.gov/officialrecords/StandardSearch.aspx"))
          except Exception as e:
              print("FAILED:",e)
          print()
          print("##### PALM BEACH Home/Index inline endpoints #####")
          try:
              page = get("https://erec.mypalmbeachclerk.com/Home/Index")
              for m in sorted(set(re.findall(r'''(?:url|href|action)\s*[:=]\s*["']([^"']{4,90})["']''', page))):
                  print("  ", m)
              print("  --- ajax-ish lines ---")
              for line in page.splitlines():
                  if ".ajax" in line or "getJSON" in line or "post(" in line.lower():
                      print("  ", line.strip()[:160])
          except Exception as e:
              print("FAILED:",e)
          PY
          cat data/logs/dump_probe.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "broward-lp-bot"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "dump probe"
          git push || true
